services:
  # Aplicação Spring Boot (NEXI PRO SaaS)
  - type: web
    name: beautysalon-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_ENABLED
        value: "false"
      - key: OPENREPLAY_ENABLED
        value: "true"
      - key: OPENREPLAY_PROJECT_KEY
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
