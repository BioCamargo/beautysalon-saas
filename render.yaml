services:
  # Aplicação Spring Boot
  - type: web
    name: beautysalon-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: beautysalon-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: beautysalon-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: beautysalon-db
          property: password
      - key: RABBITMQ_ENABLED
        value: "false"

# Banco de Dados PostgreSQL Gratuito
databases:
  - name: beautysalon-db
    databaseName: beautysalon
    user: beautysalon_user
    plan: free
