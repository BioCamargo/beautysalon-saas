name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Build, Validação de Código e Testes Automatizados
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Run Automated Tests (JUnit 5 + Mockito)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Tornar Maven Wrapper Executável
        run: chmod +x mvnw

      - name: Executar Testes Automatizados (JUnit 5 + Mockito)
        env:
          DB_URL: jdbc:postgresql://localhost:5432/studio
          DB_USERNAME: postgres
          DB_PASSWORD: password123
          RABBITMQ_ENABLED: false
        run: ./mvnw clean test

      - name: Gerar Pacote JAR da Aplicação
        env:
          DB_URL: jdbc:postgresql://localhost:5432/studio
          DB_USERNAME: postgres
          DB_PASSWORD: password123
          RABBITMQ_ENABLED: false
        run: ./mvnw package -DskipTests

      - name: Publicar Artefato JAR como Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beautysalon-backend-jar
          path: target/*.jar
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Validação da Imagem Docker Multi-stage
  # -------------------------------------------------------------
  docker-build:
    name: Build & Validate Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Build da Imagem Docker Multi-stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: beautysalon-saas:latest
