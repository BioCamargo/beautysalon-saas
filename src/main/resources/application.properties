# ===================================================================
# BeautySalon - Configurações da Aplicação
# ===================================================================
spring.application.name=BeautySalon

# -------------------------------------------------------------------
# Banco de Dados (PostgreSQL)
# Utiliza variáveis de ambiente por segurança com fallback para localhost
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# Configurações JPA / Hibernate & Flyway Migrations
# -------------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Otimizações HikariCP para Cloud / Render
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# Configurações Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# -------------------------------------------------------------------
# Configurações do Servidor Web
# -------------------------------------------------------------------
server.port=${PORT:8081}
server.servlet.context-path=/
server.forward-headers-strategy=framework
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=0

# Configurações de Sessão e Cookies (Logout automático ao fechar aba/navegador)
server.servlet.session.cookie.max-age=-1
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=60m

# -------------------------------------------------------------------
# Actuator & Observabilidade
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.com.beautysalon=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [tenant=%X{tenant}] [empresa=%X{empresa_id}] [user=%X{usuario}] - %msg%n

# -------------------------------------------------------------------
# Tratamento de Erros
# -------------------------------------------------------------------
server.error.whitelabel.enabled=false
server.error.path=/error

# -------------------------------------------------------------------
# Upload de Arquivos
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads

