# ===================================================================
# BeautySalon - Configurações da Aplicação
# ===================================================================
spring.application.name=BeautySalon

# -------------------------------------------------------------------
# Banco de Dados (PostgreSQL)
# Utiliza variáveis de ambiente por segurança com fallback para localhost
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:267-fpc-1986}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# Configurações JPA / Hibernate & Flyway Migrations
# -------------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# Configurações Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# -------------------------------------------------------------------
# Configurações do Servidor Web
# -------------------------------------------------------------------
server.port=${PORT:8081}
server.servlet.context-path=/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=0

# -------------------------------------------------------------------
# Actuator & Observabilidade
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.com.beautysalon=INFO

# -------------------------------------------------------------------
# Tratamento de Erros
# -------------------------------------------------------------------
server.error.whitelabel.enabled=false
server.error.path=/error

# -------------------------------------------------------------------
# Upload de Arquivos
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads

# -------------------------------------------------------------------
# Envio de E-mails (SMTP)
# -------------------------------------------------------------------
# spring.mail.host=${MAIL_HOST:smtp.gmail.com}
# spring.mail.port=${MAIL_PORT:587}
# spring.mail.username=${MAIL_USERNAME:}
# spring.mail.password=${MAIL_PASSWORD:}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------------------------------------------
# Mensageria Assíncrona (RabbitMQ)
# -------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}