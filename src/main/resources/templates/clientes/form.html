<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente | Beauty Salon</title>

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-layout">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('clientes')}"></div>

    <!-- MAIN AREA -->
    <div class="app-main">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar('Cadastro de Cliente', 'Formulário de inclusão e edição de cliente')}"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="page-content">
            <div class="form-container-card">
                <div class="form-header">
                    <h2 class="form-title">
                        <i class="bi bi-person-fill text-primary me-2"></i>
                        <span th:text="${cliente.id == null ? 'Novo Cliente' : 'Editar Cliente'}">Cliente</span>
                    </h2>
                    <p class="form-subtitle">Cadastre os dados de contato do cliente para agendamentos e notificações.</p>
                </div>

                <form th:action="${cliente.id == null ? '/' + empresaSlug + '/clientes' : '/' + empresaSlug + '/clientes/edit/' + cliente.id}" method="post" th:object="${cliente}">
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- NOME COMPLETO -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="nome">
                            <i class="bi bi-person me-1 text-muted"></i> Nome Completo:
                        </label>
                        <input type="text" id="nome" th:field="*{nome}" class="form-control-modern" placeholder="Ex: Keilla Silva" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                    </div>

                    <!-- E-MAIL -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="email">
                            <i class="bi bi-envelope me-1 text-muted"></i> Endereço de E-mail:
                        </label>
                        <input type="email" id="email" th:field="*{email}" class="form-control-modern" placeholder="cliente@exemplo.com" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <!-- TELEFONE -->
                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="telefone">
                                <i class="bi bi-telephone me-1 text-muted"></i> Telefone / WhatsApp:
                            </label>
                            <input type="text" id="telefone" th:field="*{telefone}" class="form-control-modern" placeholder="(11) 98888-7777" />
                            <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></span>
                        </div>

                        <!-- DATA DE NASCIMENTO -->
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="dataNascimento">
                                <i class="bi bi-gift me-1 text-muted"></i> Data de Nascimento (Aniversário):
                            </label>
                            <input type="date" id="dataNascimento" th:field="*{dataNascimento}" class="form-control-modern" />
                            <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></span>
                        </div>
                    </div>

                    <!-- AÇÕES -->
                    <div class="form-actions-bar">
                        <button type="submit" class="btn btn-gold">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${cliente.id == null ? 'Cadastrar Cliente' : 'Salvar Alterações'}">Salvar</span>
                        </button>
                        <a th:href="@{/{slug}/clientes(slug=${empresaSlug})}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
