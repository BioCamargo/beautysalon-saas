<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Novo Agendamento | NEXI PRO</title>
    <!-- Favicon Oficial NEXI PRO & PWA -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/nexipro-icon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
    <link rel="manifest" th:href="${empresaSlug != null and !#strings.isEmpty(empresaSlug)} ? @{/{slug}/manifest.json(slug=${empresaSlug})} : @{/manifest.json}">
    <meta name="theme-color" content="#0B0E14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXI PRO">

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Tom Select for Autocomplete Search -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        .ts-control {
            border-radius: var(--radius-sm) !important;
            padding: 0.65rem 1rem !important;
            border: 1px solid var(--border-color) !important;
            font-size: 0.92rem !important;
            min-height: 44px !important;
            box-shadow: none !important;
        }
        .ts-control:focus, .ts-wrapper.focus .ts-control {
            border-color: var(--accent-gold) !important;
            box-shadow: 0 0 0 3px var(--accent-gold-glow) !important;
        }
        .ts-dropdown {
            border-radius: var(--radius-sm) !important;
            box-shadow: var(--shadow-lg) !important;
            border: 1px solid var(--border-color) !important;
            font-size: 0.92rem !important;
            z-index: 1050 !important;
        }
        .ts-dropdown .active {
            background-color: var(--accent-gold-light) !important;
            color: var(--text-main) !important;
            font-weight: 600;
        }
        .ts-dropdown .option:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('agendamentos')}"></div>

    <!-- MAIN AREA -->
    <div class="app-main">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar('Agendamento', 'Marcação de horário na empresa')}"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="page-content">
            <div class="form-container-card">
                <div class="form-header">
                    <h2 class="form-title">
                        <i class="bi bi-calendar-plus text-warning me-2"></i>
                        <span th:text="${agendamento.id == null ? 'Novo Agendamento' : 'Editar Agendamento'}">Agendamento</span>
                    </h2>
                    <p class="form-subtitle">Preencha ou busque os dados para reservar o atendimento na empresa.</p>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="${agendamento.id == null ? '/' + empresaSlug + '/agendamentos' : '/' + empresaSlug + '/agendamentos/' + agendamento.id + '/atualizar'}" 
                      method="post" th:object="${agendamento}" id="agendamentoForm">
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- CLIENTE COM AUTOCOMPLETE -->
                    <div class="form-group-modern">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label-modern mb-0" for="clienteId">
                                <i class="bi bi-person-fill text-muted me-1"></i> Cliente (digite para buscar):
                            </label>
                            <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2 fw-bold" style="font-size: 0.78rem; border-radius: 6px;" onclick="abrirModalClienteRapido()">
                                <i class="bi bi-person-plus-fill me-1"></i> + Novo Cliente
                            </button>
                        </div>
                        <select id="clienteId" th:field="*{clienteId}" class="form-control-modern tom-select-autocomplete" required placeholder="Digite o nome ou telefone do cliente...">
                            <option value=""></option>
                            <option th:each="c : ${clientes}"
                                     th:value="${c.id}"
                                     th:text="${c.nome} + (${c.telefone != null and !#strings.isEmpty(c.telefone)} ? ' - ' + ${c.telefone} : '')"
                                     th:selected="${agendamento.clienteId == c.id}"></option>
                        </select>
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></span>
                    </div>

                    <!-- SERVIÇO COM AUTOCOMPLETE -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="servicoId">
                            <i class="bi bi-scissors text-muted me-1"></i> Serviço / Procedimento (digite para buscar):
                        </label>
                        <select id="servicoId" th:field="*{servicoId}" class="form-control-modern tom-select-autocomplete" required placeholder="Digite o nome do serviço...">
                            <option value=""></option>
                            <option th:each="s : ${servicos}"
                                     th:value="${s.id}"
                                     th:text="${s.nome} + ' (R$ ' + ${#numbers.formatDecimal(s.preco, 1, 2, 'POINT')} + ')'"
                                     th:selected="${agendamento.servicoId == s.id}"></option>
                        </select>
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('servicoId')}" th:errors="*{servicoId}"></span>
                    </div>

                    <!-- PROFISSIONAL COM AUTOCOMPLETE -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="profissionalId">
                            <i class="bi bi-person-badge text-muted me-1"></i> Profissional Responsável (digite para buscar):
                        </label>
                        <select id="profissionalId" th:field="*{profissionalId}" class="form-control-modern tom-select-autocomplete" placeholder="Digite o nome do profissional...">
                            <option value=""></option>
                            <option th:each="p : ${profissionais}"
                                     th:value="${p.id}"
                                     th:text="${p.nome} + (${p.especialidade != null ? ' - ' + p.especialidade : ''})"
                                     th:selected="${agendamento.profissionalId == p.id}"></option>
                        </select>
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('profissionalId')}" th:errors="*{profissionalId}"></span>
                    </div>

                    <!-- DATA E HORA COM VALIDAÇÃO DE HORÁRIO ATUAL -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="dataHora">
                            <i class="bi bi-clock text-muted me-1"></i> Data e Horário (a partir de agora):
                        </label>
                        <input type="datetime-local" id="dataHora" name="dataHora" 
                               th:value="${agendamento.dataHora != null ? #temporals.format(agendamento.dataHora, 'yyyy-MM-dd''T''HH:mm') : ''}" 
                               class="form-control-modern" required />
                        <div class="form-text small text-muted">
                            <i class="bi bi-info-circle me-1"></i> Horários passados não são permitidos para novos agendamentos.
                        </div>
                        <span class="text-danger small mt-1 d-block" id="dataHoraValidationMsg" style="display:none;"></span>
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></span>
                    </div>

                    <!-- STATUS (EXIBIDO NA EDIÇÃO OU CRIAÇÃO) -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="status">
                            <i class="bi bi-tag-fill text-muted me-1"></i> Situação / Status:
                        </label>
                        <select id="status" th:field="*{status}" class="form-control-modern">
                            <option value="AGENDADO" th:selected="${agendamento.status == null or agendamento.status == 'AGENDADO'}">Agendado</option>
                            <option value="EM_ATENDIMENTO" th:selected="${agendamento.status == 'EM_ATENDIMENTO'}">Em Atendimento</option>
                            <option value="CONCLUIDO" th:selected="${agendamento.status == 'CONCLUIDO'}">Concluído</option>
                            <option value="CANCELADO" th:selected="${agendamento.status == 'CANCELADO'}">Cancelado</option>
                            <option value="NAO_COMPARECEU" th:selected="${agendamento.status == 'NAO_COMPARECEU'}">Não Compareceu (No-show)</option>
                        </select>
                    </div>

                    <!-- OBSERVAÇÕES -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="observacoes">
                            <i class="bi bi-card-text text-muted me-1"></i> Observações (opcional):
                        </label>
                        <textarea id="observacoes" th:field="*{observacoes}" class="form-control-modern" placeholder="Ex: Preferência por produtos específicos, observações técnicas..."></textarea>
                    </div>

                    <!-- BOTÕES DE AÇÃO -->
                    <div class="form-actions-bar">
                        <button type="submit" class="btn btn-gold" id="btnSubmit">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${agendamento.id == null ? 'Confirmar Agendamento' : 'Salvar Alterações'}">Salvar</span>
                        </button>
                        <a th:href="@{/{slug}/agendamentos(slug=${empresaSlug})}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Inicializa Autocomplete com TomSelect
        document.querySelectorAll('.tom-select-autocomplete').forEach(function(el) {
            const hasPreselected = el.getAttribute('data-has-value') || el.value;
            const ts = new TomSelect(el, {
                create: false,
                sortField: { field: "text", direction: "asc" },
                placeholder: el.getAttribute('placeholder') || 'Digite para pesquisar...',
                allowEmptyOption: false,
                maxOptions: 100,
                plugins: ['clear_button'],
                onFocus: function() {
                    // Quando foca no campo, abre o dropdown imediatamente
                    this.open();
                }
            });

            // Se for um novo agendamento e não houver valor prévio selecionado, garante campo limpo exibindo placeholder
            if (!el.value) {
                ts.clear(true);
            }
            if (el.id === "clienteId") {
                window.clienteTomSelect = ts;
            }
        });

        // Configura data/hora mínima permitida (Agora)
        const dataHoraInput = document.getElementById('dataHora');
        const form = document.getElementById('agendamentoForm');
        const validationMsg = document.getElementById('dataHoraValidationMsg');

        function formatToLocalISO(date) {
            const pad = (n) => String(n).padStart(2, '0');
            const year = date.getFullYear();
            const month = pad(date.getMonth() + 1);
            const day = pad(date.getDate());
            const hours = pad(date.getHours());
            const minutes = pad(date.getMinutes());
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        const now = new Date();
        const minDateTimeString = formatToLocalISO(now);
        dataHoraInput.min = minDateTimeString;

        // Se for um novo agendamento e o campo estiver vazio, sugere a hora atual arredondada para o próximo múltiplo de 30 min
        if (!dataHoraInput.value) {
            const roundedDate = new Date(now.getTime());
            const remainder = 30 - (roundedDate.getMinutes() % 30);
            roundedDate.setMinutes(roundedDate.getMinutes() + remainder);
            roundedDate.setSeconds(0);
            roundedDate.setMilliseconds(0);
            dataHoraInput.value = formatToLocalISO(roundedDate);
        }

        // Validação no submit para garantir que data/hora >= agora
        if (form) {
            form.addEventListener('submit', function (e) {
                const selectedDate = new Date(dataHoraInput.value);
                const currentNow = new Date();
                
                // Dá uma tolerância de 2 minutos para evitar erro de segundos durante o preenchimento
                currentNow.setMinutes(currentNow.getMinutes() - 2);

                if (selectedDate < currentNow) {
                    e.preventDefault();
                    if (validationMsg) {
                        validationMsg.textContent = 'Não é permitido selecionar uma data ou horário anterior ao momento atual.';
                        validationMsg.style.display = 'block';
                    }
                    dataHoraInput.focus();
                } else {
                    if (validationMsg) {
                        validationMsg.style.display = 'none';
                    }
                }
            });
        }
    });
</script>

<!-- MODAL DE CADASTRO RÃPIDO DE CLIENTE -->
<div class="modal fade" id="modalNovoClienteRapido" tabindex="-1" aria-labelledby="modalNovoClienteRapidoLabel" aria-hidden="true" style="z-index: 1080 !important;">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden; background: #0f172a; color: #ffffff; border: 1px solid rgba(0, 210, 238, 0.3);">
            <div class="modal-header border-0 py-3" style="background: rgba(255, 255, 255, 0.05);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-plus-fill text-info fs-5"></i>
                    <h5 class="modal-title fw-bold fs-6 mb-0 text-white" id="modalNovoClienteRapidoLabel">Cadastro RÃ¡pido de Cliente</h5>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body p-4">
                <form id="formClienteRapido" onsubmit="salvarClienteRapido(event)">
                    <div class="mb-3 text-start">
                        <label class="form-label fw-semibold small text-white-50" for="rapidoNome">Nome Completo *</label>
                        <input type="text" class="form-control" id="rapidoNome" required placeholder="Ex: Camila Ferreira" style="background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: #fff;">
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label fw-semibold small text-white-50" for="rapidoTelefone">WhatsApp / Telefone</label>
                        <input type="text" class="form-control" id="rapidoTelefone" placeholder="(11) 98765-4321" style="background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: #fff;">
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label fw-semibold small text-white-50" for="rapidoEmail">E-mail (opcional)</label>
                        <input type="email" class="form-control" id="rapidoEmail" placeholder="cliente@email.com" style="background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: #fff;">
                    </div>
                    <div id="rapidoFeedbackErro" class="alert alert-danger py-2 small d-none"></div>
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-light btn-sm rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnSalvarClienteRapido" class="btn btn-info btn-sm rounded-pill px-4 fw-bold text-dark" style="background: #00D2EE; border: none;">
                            <i class="bi bi-check-lg me-1"></i> Salvar e Selecionar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    let clienteModalInstance = null;
    const currentSlug = /*[[${empresaSlug}]]*/ 'studio';

    function abrirModalClienteRapido() {
        const el = document.getElementById('modalNovoClienteRapido');
        if (el) {
            document.getElementById('formClienteRapido').reset();
            document.getElementById('rapidoFeedbackErro').classList.add('d-none');
            clienteModalInstance = bootstrap.Modal.getOrCreateInstance(el);
            clienteModalInstance.show();
            setTimeout(() => {
                const inp = document.getElementById('rapidoNome');
                if (inp) inp.focus();
            }, 300);
        }
    }

    function salvarClienteRapido(e) {
        e.preventDefault();
        const nome = document.getElementById('rapidoNome').value.trim();
        const telefone = document.getElementById('rapidoTelefone').value.trim();
        const email = document.getElementById('rapidoEmail').value.trim();
        const btn = document.getElementById('btnSalvarClienteRapido');
        const erroDiv = document.getElementById('rapidoFeedbackErro');

        if (!nome || nome.length < 2) {
            erroDiv.textContent = 'Informe o nome do cliente (mÃ­nimo 2 letras).';
            erroDiv.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Salvando...';

        const token = document.querySelector('meta[name="_csrf"]') ? document.querySelector('meta[name="_csrf"]').getAttribute('content') : '';
        const header = document.querySelector('meta[name="_csrf_header"]') ? document.querySelector('meta[name="_csrf_header"]').getAttribute('content') : 'X-CSRF-TOKEN';

        fetch('/' + currentSlug + '/clientes/api/rapido', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [header]: token
            },
            body: JSON.stringify({ nome: nome, telefone: telefone, email: email })
        })
        .then(res => res.json())
        .then(data => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-lg me-1"></i> Salvar e Selecionar';

            if (data.success && data.id) {
                const label = data.nome + (data.telefone ? ' - ' + data.telefone : '');
                
                // Adiciona e seleciona no TomSelect
                if (window.clienteTomSelect) {
                    window.clienteTomSelect.addOption({ value: data.id, text: label });
                    window.clienteTomSelect.setValue(data.id);
                } else {
                    const sel = document.getElementById('clienteId');
                    if (sel) {
                        const opt = new Option(label, data.id, true, true);
                        sel.add(opt);
                    }
                }

                if (clienteModalInstance) {
                    clienteModalInstance.hide();
                }

                if (typeof showLuxToast === 'function') {
                    showLuxToast('Cliente Cadastrado', data.nome + ' foi cadastrado(a) e selecionado(a)!', 'success');
                }
            } else {
                erroDiv.textContent = data.message || 'Erro ao cadastrar cliente.';
                erroDiv.classList.remove('d-none');
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-lg me-1"></i> Salvar e Selecionar';
            erroDiv.textContent = 'Erro ao conectar ao servidor. Tente novamente.';
            erroDiv.classList.remove('d-none');
        });
    }
    /*]]>*/
</script>
</body>
</html>
