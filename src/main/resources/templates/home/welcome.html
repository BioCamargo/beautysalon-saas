<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="welcome" class="content-card mb-4"
        style="background: linear-gradient(135deg, #0b0f19 0%, #1e293b 100%); color: #ffffff; border: 1px solid rgba(197, 160, 89, 0.3);">
        <div class="p-4 d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
            <div>
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="badge"
                        style="background-color: var(--accent-gold); color: #0b0f19; font-weight: 700; font-size: 0.75rem; letter-spacing: 1px;">PAINEL
                        OPERACIONAL</span>
                    <span class="text-white-50" style="font-size: 0.8rem;"
                        th:text="${empresaNome != null ? empresaNome : 'BeautySalon & Estética'}">BeautySalon &
                        Estética</span>
                </div>
                <h2 class="mb-1" style="font-family: var(--font-serif); font-size: 1.75rem; color: #ffffff;">
                    Olá, <span
                        th:text="${#authentication != null and #authentication.name != null and #authentication.name != 'anonymousUser' ? #authentication.name : 'Visitante'}"
                        style="color: var(--accent-gold);">Operador</span>!
                </h2>
                <p class="mb-0 text-white-50" style="font-size: 0.92rem;">
                    Bem-vindo ao sistema de gestão do seu Studio. Acompanhe atendimentos, clientes e catálogo em tempo
                    real.
                </p>
            </div>
        </div>
    </div>

</body>

</html>
