<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Serviço | Beauty Salon</title>

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-layout">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('servicos')}"></div>

    <!-- MAIN AREA -->
    <div class="app-main">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar('Cadastro de Serviço', 'Inclusão ou alteração de procedimento no catálogo')}"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="page-content">
            <div class="form-container-card">
                <div class="form-header">
                    <h2 class="form-title">
                        <i class="bi bi-scissors text-success me-2"></i>
                        <span th:text="${servico.id == null ? 'Novo Serviço' : 'Editar Serviço'}">Serviço</span>
                    </h2>
                    <p class="form-subtitle">Informe o título, descrição, valor monetário e faça upload de uma foto ilustrativa.</p>
                </div>

                <form th:action="@{${formAction}}" method="post" enctype="multipart/form-data" th:object="${servico}">
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- TÍTULO DO SERVIÇO -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="nome">
                            <i class="bi bi-tag-fill text-muted me-1"></i> Nome do Procedimento:
                        </label>
                        <input type="text" id="nome" th:field="*{nome}" class="form-control-modern" placeholder="Ex: Escova Progressiva, Corte Feminino, Manicure" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                    </div>

                    <!-- DESCRIÇÃO -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="descricao">
                            <i class="bi bi-text-paragraph text-muted me-1"></i> Descrição Detalhada:
                        </label>
                        <textarea id="descricao" th:field="*{descricao}" class="form-control-modern" placeholder="Detalhes do que está incluso neste atendimento..."></textarea>
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
                    </div>

                    <!-- PREÇO -->
                    <div class="form-group-modern">
                        <label class="form-label-modern" for="preco">
                            <i class="bi bi-currency-dollar text-muted me-1"></i> Preço do Procedimento (R$):
                        </label>
                        <input type="number" id="preco" step="0.01" min="0" th:field="*{preco}" class="form-control-modern" placeholder="0.00" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></span>
                    </div>

                    <!-- UPLOAD DE IMAGEM COM DROPZONE E PREVIEW -->
                    <div class="form-group-modern">
                        <label class="form-label-modern">
                            <i class="bi bi-image-fill text-muted me-1"></i> Imagem do Serviço:
                        </label>
                        
                        <div class="upload-dropzone" onclick="document.getElementById('imagemFileInput').click()">
                            <i class="bi bi-cloud-arrow-up upload-icon"></i>
                            <div class="upload-text" id="uploadFileName">Clique aqui ou arraste para selecionar uma imagem</div>
                            <div class="upload-hint">Formatos suportados: JPG, PNG, WEBP (Máx. 5MB)</div>
                            <input type="file" id="imagemFileInput" name="imagemFile" accept="image/*" th:field="*{imagemFile}" style="display: none;" onchange="previewSelectedImage(event)" />
                        </div>

                        <!-- PREVIEW DA IMAGEM ATUAL OU SELECIONADA -->
                        <div class="image-preview-box" id="imagePreviewContainer" th:style="${servico.imagem != null and !servico.imagem.isEmpty()} ? 'display:block;' : 'display:none;'">
                            <span class="d-block small text-muted mb-1">Pré-visualização:</span>
                            <img id="imagePreviewImg" class="image-preview-thumb" 
                                 th:src="${servico.imagem != null} ? @{/uploads/{file}(file=${servico.imagem})} : ''" 
                                 alt="Preview da imagem" onerror="this.style.display='none'" />
                        </div>
                    </div>

                    <!-- BOTÕES DE AÇÃO -->
                    <div class="form-actions-bar">
                        <button type="submit" class="btn btn-gold">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${servico.id != null ? 'Atualizar Serviço' : 'Salvar no Catálogo'}">Salvar</span>
                        </button>
                        <a th:href="@{/{slug}/servicos(slug=${empresaSlug})}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script>
    function previewSelectedImage(event) {
        const file = event.target.files[0];
        const previewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('imagePreviewImg');
        const labelText = document.getElementById('uploadFileName');

        if (file) {
            labelText.textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewImg.style.display = 'inline-block';
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }
</script>

</body>
</html>
