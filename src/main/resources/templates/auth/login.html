<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Beauty Salon Studio</title>
    
    <!-- Bootstrap Icons & Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-card-modern">
    <!-- CABEÇALHO DO CARD -->
    <div class="auth-header">
        <img th:src="@{/images/logo.jpg}" alt="Beauty Salon Studio" class="auth-logo-img"
             onerror="this.style.display='none'; document.getElementById('authBrandFallback').style.display='block';" />
        <div id="authBrandFallback" style="display: none; margin-bottom: 1rem;">
            <div class="auth-title-brand">BEAUTY SALON</div>
        </div>
        <div class="auth-subtitle-brand">Sistema de Gestão do Estúdio</div>
    </div>

    <!-- MENSAGENS DE ALERTA -->
    <div th:if="${param.error}" class="auth-alert auth-alert-error">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Usuário ou senha inválidos. Tente novamente.</span>
    </div>

    <div th:if="${param.registered}" class="auth-alert auth-alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>Cadastro realizado com sucesso! Faça login abaixo.</span>
    </div>

    <div th:if="${param.logout}" class="auth-alert auth-alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>Sessão encerrada com segurança.</span>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form th:action="@{/login}" method="post">
        <div class="auth-input-group">
            <i class="bi bi-person-fill"></i>
            <input type="text" id="username" name="username" placeholder="Nome de usuário" required autofocus />
        </div>

        <div class="auth-input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="password" name="password" placeholder="Sua senha" required />
            <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
        </div>

        <button type="submit" class="btn-auth mt-2">
            <span>Entrar no Sistema</span>
            <i class="bi bi-arrow-right ms-2"></i>
        </button>
    </form>

    <!-- LINK DE AUTOCADASTRO -->
    <div class="auth-footer">
        <span>Primeiro acesso? </span>
        <a th:href="@{/register}">Criar uma nova conta</a>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>

</body>
</html>
