<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre seu Salão | Lumora Studio SaaS</title>
    
    <!-- Bootstrap Icons & Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-card-modern" style="max-width: 540px;">
    <!-- CABEÇALHO DO CARD -->
    <div class="auth-header">
        <img th:src="@{/images/logo.jpg}" alt="Beauty Salon Studio" class="auth-logo-img"
             onerror="this.style.display='none'; document.getElementById('authBrandFallback').style.display='block';" />
        <div id="authBrandFallback" style="display: none; margin-bottom: 0.5rem;">
            <div class="auth-title-brand">BEAUTY SALON</div>
        </div>
        <div class="auth-subtitle-brand">Cadastre seu Estúdio / Salão de Beleza</div>
    </div>

    <!-- RECIPIENTE DE MENSAGENS AJAX -->
    <div id="message-container"></div>

    <!-- FORMULÁRIO DE REGISTRO DA EMPRESA + OWNER -->
    <form id="registerForm" th:action="@{/register-empresa}" method="post">
        
        <div style="font-weight: 700; font-size: 0.85rem; color: var(--gold-dark, #b8860b); text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.5px;">
            <i class="bi bi-building me-1"></i> Dados do Salão / Estúdio
        </div>

        <div class="auth-input-group">
            <i class="bi bi-shop"></i>
            <input type="text" id="nomeEmpresa" name="nomeEmpresa" placeholder="Nome do Salão ou Estúdio" required autofocus />
        </div>

        <div class="auth-input-group">
            <i class="bi bi-envelope-at"></i>
            <input type="email" id="emailEmpresa" name="emailEmpresa" placeholder="E-mail de contato do salão" required />
        </div>

        <div style="display: flex; gap: 0.75rem;">
            <div class="auth-input-group" style="flex: 1;">
                <i class="bi bi-telephone"></i>
                <input type="text" id="telefoneEmpresa" name="telefoneEmpresa" placeholder="Telefone / WhatsApp" />
            </div>
            <div class="auth-input-group" style="flex: 1;">
                <i class="bi bi-card-text"></i>
                <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ (opcional)" />
            </div>
        </div>

        <div style="font-weight: 700; font-size: 0.85rem; color: var(--gold-dark, #b8860b); text-transform: uppercase; margin: 1rem 0 0.5rem; letter-spacing: 0.5px;">
            <i class="bi bi-person-badge me-1"></i> Administrador Responsável
        </div>

        <div class="auth-input-group">
            <i class="bi bi-person"></i>
            <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Seu nome completo" required />
        </div>

        <div class="auth-input-group">
            <i class="bi bi-person-circle"></i>
            <input type="text" id="username" name="username" placeholder="Nome de usuário para login" required />
        </div>

        <div class="auth-input-group">
            <i class="bi bi-envelope"></i>
            <input type="email" id="emailUsuario" name="emailUsuario" placeholder="Seu e-mail pessoal" required />
        </div>

        <div style="display: flex; gap: 0.75rem;">
            <div class="auth-input-group" style="flex: 1;">
                <i class="bi bi-lock-fill"></i>
                <input type="password" id="password" name="password" placeholder="Senha (mín. 6 dígitos)" required />
            </div>
            <div class="auth-input-group" style="flex: 1;">
                <i class="bi bi-shield-lock-fill"></i>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirme a senha" required />
            </div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="csrfToken"/>

        <button type="submit" id="btnSubmit" class="btn-auth mt-3">
            <span>Cadastrar Estúdio & Acessar</span>
            <i class="bi bi-arrow-right-circle-fill ms-2"></i>
        </button>
    </form>

    <!-- LINK PARA VOLTAR AO LOGIN -->
    <div class="auth-footer">
        <span>Já possui seu estúdio cadastrado? </span>
        <a th:href="@{/login}">Fazer Login</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData(form);
        const messageContainer = document.getElementById('message-container');
        const submitBtn = document.getElementById('btnSubmit');

        messageContainer.innerHTML = '';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Criando estúdio e configurando ambiente...</span>';

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRF-TOKEN': document.getElementById('csrfToken').value
            }
        })
        .then(response => response.json())
        .then(data => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Cadastrar Estúdio & Acessar</span> <i class="bi bi-arrow-right-circle-fill ms-2"></i>';

            if (data.success) {
                window.location.href = data.redirectUrl || '/login?registered=true';
            } else {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'auth-alert auth-alert-error';

                let errorHtml = '<i class="bi bi-exclamation-triangle-fill"></i><div>';
                if (data.errors && data.errors.length > 0) {
                    data.errors.forEach(error => {
                        errorHtml += `<div>${error}</div>`;
                    });
                } else if (data.message) {
                    errorHtml += `<div>${data.message}</div>`;
                } else {
                    errorHtml += `<div>Erro ao registrar empresa. Verifique os dados inseridos.</div>`;
                }
                errorHtml += '</div>';

                errorDiv.innerHTML = errorHtml;
                messageContainer.appendChild(errorDiv);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Cadastrar Estúdio & Acessar</span> <i class="bi bi-arrow-right-circle-fill ms-2"></i>';

            const errorDiv = document.createElement('div');
            errorDiv.className = 'auth-alert auth-alert-error';
            errorDiv.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i><span>Ocorreu um erro ao comunicar com o servidor. Tente novamente.</span>';
            messageContainer.appendChild(errorDiv);
        });
    });
</script>

</body>
</html>
