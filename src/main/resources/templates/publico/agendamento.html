<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Agendamento Online | Beauty Salon</title>

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        body {
            background-color: #0f1115;
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .public-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }
        .public-card {
            background: #181c24;
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 2.5rem;
        }
        .service-select-card {
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .service-select-card:hover {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.05);
        }
        .service-select-card input[type="radio"]:checked + .service-info {
            color: #c5a059;
        }
        .time-slot-btn {
            border: 1px solid rgba(255,255,255,0.15);
            background: #202632;
            color: #f8fafc;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .time-slot-btn:hover, .time-slot-btn.active {
            background: #c5a059;
            color: #000;
            font-weight: 700;
            border-color: #c5a059;
        }
    </style>
</head>
<body>

<div class="public-container">
    <!-- CABEÇALHO DO SALÃO -->
    <div class="text-center mb-4">
        <h1 class="display-6 fw-bold text-gradient-gold" th:text="${empresa != null ? empresa.getNome() : 'Studio & Estética'}">Beauty Salon</h1>
        <p class="text-muted">Escolha o serviço desejado, o profissional e o melhor horário para seu atendimento.</p>
    </div>

    <!-- MENSAGEM DE ERRO -->
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="public-card">
        <form th:action="@{/{slug}/agendar/confirmar(slug=${empresaSlug})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- PASSO 1: DADOS DO CLIENTE -->
            <div class="mb-4">
                <h4 class="text-gold mb-3"><i class="bi bi-person-fill me-2"></i>1. Seus Dados de Contato</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Nome Completo:</label>
                        <input type="text" name="clienteNome" class="form-control-modern" placeholder="Ex: Juliana Mendes" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">WhatsApp / Celular:</label>
                        <input type="tel" name="clienteTelefone" class="form-control-modern" placeholder="(11) 99999-8888" required />
                    </div>
                    <div class="col-md-12">
                        <label class="form-label text-muted small">E-mail (opcional):</label>
                        <input type="email" name="clienteEmail" class="form-control-modern" placeholder="juliana@exemplo.com" />
                    </div>
                </div>
            </div>

            <hr class="border-secondary my-4" />

            <!-- PASSO 2: SELEÇÃO DE PROCEDIMENTO / SERVIÇO -->
            <div class="mb-4">
                <h4 class="text-gold mb-3"><i class="bi bi-scissors me-2"></i>2. Escolha o Serviço</h4>
                <div class="services-list">
                    <div th:each="s, stat : ${servicos}" class="service-select-card">
                        <div class="form-check d-flex align-items-center gap-2">
                            <input class="form-check-input" type="radio" name="servicoId" th:id="'servico_' + ${s.id}" th:value="${s.id}" th:checked="${stat.first}" required />
                            <label class="form-check-label service-info ms-2" th:for="'servico_' + ${s.id}">
                                <strong class="d-block text-light" th:text="${s.nome}">Corte e Escova</strong>
                                <span class="text-muted small" th:text="${s.descricao} ?: 'Procedimento completo'">Descrição</span>
                            </label>
                        </div>
                        <div class="text-end">
                            <span class="badge" style="background-color: rgba(197, 160, 89, 0.2); color: #e2c07e; font-size: 1rem; font-weight: 700;">
                                R$ <span th:text="${#numbers.formatDecimal(s.preco, 1, 2, 'POINT')}">120.00</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <hr class="border-secondary my-4" />

            <!-- PASSO 3: PROFISSIONAL E DATA/HORA -->
            <div class="mb-4">
                <h4 class="text-gold mb-3"><i class="bi bi-calendar-event me-2"></i>3. Escolha o Profissional e a Data</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Profissional (opcional):</label>
                        <select name="profissionalId" class="form-control-modern">
                            <option value="">Qualquer profissional disponível</option>
                            <option th:each="p : ${profissionais}" th:value="${p.id}" th:text="${p.nome} + ' (' + (${p.especialidade} ?: 'Especialista') + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Data do Atendimento:</label>
                        <input type="date" id="dataAgendamento" name="data" class="form-control-modern" required th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" />
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label text-muted small">Horário de Atendimento (24/7 Flexível):</label>
                    <div class="row g-2 align-items-center mb-2">
                        <div class="col-md-5">
                            <input type="time" id="horarioInput" name="horario" class="form-control-modern" value="09:00" required />
                        </div>
                        <div class="col-md-7 text-muted small">
                            <i class="bi bi-clock me-1"></i> Digite ou escolha qualquer horário disponível 24h.
                        </div>
                    </div>
                    <label class="form-label text-muted small d-block mb-1">Ou selecione um horário rápido:</label>
                    <div class="d-flex flex-wrap gap-2" id="horariosContainer">
                        <button type="button" class="time-slot-btn" data-time="07:00">07:00</button>
                        <button type="button" class="time-slot-btn" data-time="08:00">08:00</button>
                        <button type="button" class="time-slot-btn active" data-time="09:00">09:00</button>
                        <button type="button" class="time-slot-btn" data-time="10:00">10:00</button>
                        <button type="button" class="time-slot-btn" data-time="11:00">11:00</button>
                        <button type="button" class="time-slot-btn" data-time="12:00">12:00</button>
                        <button type="button" class="time-slot-btn" data-time="13:00">13:00</button>
                        <button type="button" class="time-slot-btn" data-time="14:00">14:00</button>
                        <button type="button" class="time-slot-btn" data-time="15:00">15:00</button>
                        <button type="button" class="time-slot-btn" data-time="16:00">16:00</button>
                        <button type="button" class="time-slot-btn" data-time="17:00">17:00</button>
                        <button type="button" class="time-slot-btn" data-time="18:00">18:00</button>
                        <button type="button" class="time-slot-btn" data-time="19:00">19:00</button>
                        <button type="button" class="time-slot-btn" data-time="20:00">20:00</button>
                        <button type="button" class="time-slot-btn" data-time="21:00">21:00</button>
                        <button type="button" class="time-slot-btn" data-time="22:00">22:00</button>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label text-muted small">Observações ou Preferências:</label>
                    <textarea name="observacoes" class="form-control-modern" placeholder="Ex: Preferência por tintura sem amônia..."></textarea>
                </div>
            </div>

            <!-- BOTÃO DE CONFIRMAR -->
            <button type="submit" class="btn btn-gold w-100 py-3 fw-bold fs-5 shadow-lg mt-3">
                <i class="bi bi-check-circle-fill me-2"></i> Confirmar Meu Agendamento
            </button>
        </form>
    </div>

    <!-- RODAPÉ -->
    <div class="text-center mt-4 text-muted small">
        &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> <span th:text="${empresa != null ? empresa.getNome() : 'Beauty Salon'}">Beauty Salon</span> &bull; Powered by BeautySalon SaaS
    </div>
</div>

<script>
    // Define a data de hoje por padrão se não preenchido
    const dataInput = document.getElementById('dataAgendamento');
    const profissionalSelect = document.querySelector('select[name="profissionalId"]');
    const todayStr = new Date().toISOString().split('T')[0];
    if (dataInput) {
        dataInput.min = todayStr;
        if (!dataInput.value) {
            dataInput.value = todayStr;
        }
    }

    const horarioInput = document.getElementById('horarioInput');
    const timeBtns = document.querySelectorAll('.time-slot-btn');

    function carregarHorariosOcupados() {
        if (!dataInput || !dataInput.value) return;
        const data = dataInput.value;
        const profId = profissionalSelect ? profissionalSelect.value : '';
        const currentPath = window.location.pathname.replace(/\/$/, "");

        fetch(`${currentPath}/horarios-ocupados?data=${data}&profissionalId=${profId}`)
            .then(res => res.json())
            .then(ocupados => {
                timeBtns.forEach(btn => {
                    const time = btn.getAttribute('data-time');
                    if (ocupados.includes(time)) {
                        btn.disabled = true;
                        btn.style.opacity = '0.3';
                        btn.style.textDecoration = 'line-through';
                        btn.style.cursor = 'not-allowed';
                        btn.title = 'Horário indisponível/ocupado';
                        if (btn.classList.contains('active')) {
                            btn.classList.remove('active');
                            if (horarioInput && horarioInput.value === time) {
                                horarioInput.value = '';
                            }
                        }
                    } else {
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        btn.style.textDecoration = 'none';
                        btn.style.cursor = 'pointer';
                        btn.title = 'Disponível';
                    }
                });
            })
            .catch(err => console.error('Erro ao buscar horários ocupados:', err));
    }

    if (dataInput) {
        dataInput.addEventListener('change', carregarHorariosOcupados);
    }
    if (profissionalSelect) {
        profissionalSelect.addEventListener('change', carregarHorariosOcupados);
    }

    timeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.disabled) return;
            timeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (horarioInput) {
                horarioInput.value = btn.getAttribute('data-time');
            }
        });
    });

    if (horarioInput) {
        horarioInput.addEventListener('input', () => {
            timeBtns.forEach(b => {
                if (b.getAttribute('data-time') === horarioInput.value && !b.disabled) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });
        });
    }

    // Inicializa verificação de ocupação
    carregarHorariosOcupados();

    // Validação de horário no envio
    const formPublico = document.querySelector('form');
    if (formPublico) {
        formPublico.addEventListener('submit', function(e) {
            if (dataInput && horarioInput) {
                if (!horarioInput.value) {
                    e.preventDefault();
                    alert('Por favor, selecione um horário válido e disponível.');
                    return;
                }
                const parts = horarioInput.value.split(':');
                if (parts.length >= 2) {
                    const selected = new Date(dataInput.value + 'T' + parts[0] + ':' + parts[1] + ':00');
                    const now = new Date();
                    now.setMinutes(now.getMinutes() - 2); // 2 minutos de tolerância
                    if (selected < now) {
                        e.preventDefault();
                        alert('Por favor, selecione um horário a partir do momento atual.');
                        horarioInput.focus();
                    }
                }
            }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
