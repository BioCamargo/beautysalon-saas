<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Ops! Ocorreu um erro | NEXI PRO</title>
    <!-- Favicon Oficial NEXI PRO & PWA -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/nexipro-icon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B0E14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXI PRO">
    
    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-card-modern text-center" style="max-width: 520px;">
    <div class="mb-3">
        <i class="bi bi-exclamation-octagon text-danger" style="font-size: 3.5rem;"></i>
    </div>

    <h2 class="auth-title-brand mb-2">Ops! Algo deu errado</h2>
    <div class="badge bg-danger bg-opacity-10 text-danger px-3 py-2 rounded-pill mb-3" th:if="${errorCode}" th:text="'Código do Erro: ' + ${errorCode}">Erro 500</div>

    <p class="text-muted mb-4" th:if="${errorMessage}" th:text="${errorMessage}">
        Desculpe pelo transtorno. Uma falha inesperada ocorreu ao processar sua solicitação.
    </p>
    <p class="text-muted mb-4" th:unless="${errorMessage}">
        Desculpe pelo transtorno. Uma falha inesperada ocorreu no sistema. Nossa equipe técnica já foi notificada.
    </p>

    <div class="d-flex flex-wrap justify-content-center gap-2">
        <a th:href="@{/}" class="btn btn-gold">
            <i class="bi bi-house-door-fill"></i> Ir para o Início
        </a>
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i> Voltar à página anterior
        </button>
    </div>
</div>

</body>
</html>
