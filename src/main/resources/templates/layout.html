<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Beauty Salon - Studio'">Beauty Salon</title>

    <!-- Bootstrap 5.3.2 & Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- FullCalendar CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom Luxury Style -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>
<body>

<div class="app-layout">
    <!-- SIDEBAR FRAGMENT -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage} ?: '')}"></div>

    <!-- MAIN APP AREA -->
    <div class="app-main">
        <!-- TOPBAR FRAGMENT -->
        <div th:replace="~{fragments/topbar :: topbar(${pageTitle} ?: 'Beauty Salon', ${pageSubtitle} ?: null)}"></div>

        <!-- MAIN PAGE CONTENT FRAGMENT -->
        <main class="page-content" th:fragment="main(content)">
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</body>
</html>
