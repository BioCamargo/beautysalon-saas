<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'NEXI PRO | Gestão Inteligente'">NEXI PRO | Gestão Inteligente</title>

    <!-- Favicon Oficial NEXI PRO -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/nexipro-icon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">

    <!-- Bootstrap 5.3.2 & Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FullCalendar CDN (v6 já injeta os estilos automaticamente via JS) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>


    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom Luxury Style -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body>

    <div class="app-layout">
        <!-- SIDEBAR FRAGMENT -->
        <div th:replace="~{fragments/sidebar :: sidebar(${activePage} ?: '')}"></div>

        <!-- MAIN APP AREA -->
        <div class="app-main">
            <!-- TOPBAR FRAGMENT -->
            <div th:replace="~{fragments/topbar :: topbar(${pageTitle} ?: 'NEXI PRO', ${pageSubtitle} ?: null)}">
            </div>

            <!-- MAIN PAGE CONTENT FRAGMENT -->
            <main class="page-content" th:fragment="main(content)">
                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>

    <!-- Toast Container Global NEXI PRO 2.0 -->
    <div id="lux-toast-container"></div>


    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- NEXI PRO UI Engine (Vanilla JS puro - Zero dependência jQuery) -->
    <script>
        /**
         * Exibe notificação flutuante elegante (Toasts)
         * @param {string} message Texto da mensagem
         * @param {'success'|'error'|'warning'|'info'} type Tipo do alerta
         * @param {number} duration Duração em milissegundos
         */
        window.showToast = function(message, type = 'success', duration = 4000) {
            const container = document.getElementById('lux-toast-container');
            if (!container) return;

            const icons = {
                success: 'bi-check-circle-fill',
                error: 'bi-x-circle-fill',
                warning: 'bi-exclamation-triangle-fill',
                info: 'bi-info-circle-fill'
            };

            const titles = {
                success: 'Sucesso',
                error: 'Atenção / Erro',
                warning: 'Aviso Importante',
                info: 'Informação'
            };

            const toast = document.createElement('div');
            toast.className = `lux-toast toast-${type}`;
            toast.innerHTML = `
                <div class="lux-toast-icon">
                    <i class="bi ${icons[type] || icons.info}"></i>
                </div>
                <div class="lux-toast-content">
                    <div class="lux-toast-title">${titles[type] || 'Notificação'}</div>
                    <div class="lux-toast-msg">${message}</div>
                </div>
                <button type="button" class="lux-toast-close" aria-label="Fechar">
                    <i class="bi bi-x"></i>
                </button>
            `;

            const closeToast = () => {
                toast.style.animation = 'luxToastFadeOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                setTimeout(() => toast.remove(), 300);
            };

            toast.querySelector('.lux-toast-close').addEventListener('click', closeToast);
            container.appendChild(toast);

            if (duration > 0) {
                setTimeout(closeToast, duration);
            }
        };
    </script>
</body>
</html>
