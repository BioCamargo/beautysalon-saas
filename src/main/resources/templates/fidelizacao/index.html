<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidelização & CRM | Beauty Salon</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('fidelizacao')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/topbar :: topbar('Fidelização de Clientes & CRM', 'Retenção, aniversariantes, cupons e vouchers de presente')}"></div>

        <main class="page-content">
            <!-- MENSAGENS -->
            <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- SEÇÃO DE RETENÇÃO E ANIVERSARIANTES -->
            <div class="row g-4 mb-4">
                <!-- CLIENTES EM RISCO / AUSENTES -->
                <div class="col-lg-6">
                    <div class="content-card h-100">
                        <div class="card-header-custom d-flex justify-content-between align-items-center">
                            <h3 class="card-title-custom text-danger">
                                <i class="bi bi-clock-history"></i>
                                <span>Radar de Retenção (+30 dias sem vir)</span>
                            </h3>
                            <span class="badge bg-danger" th:text="${clientesAusentes != null ? clientesAusentes.size() : 0} + ' clientes'">0 clientes</span>
                        </div>
                        <div class="p-3">
                            <div class="list-group list-group-flush">
                                <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3" th:each="ca : ${clientesAusentes}">
                                    <div>
                                        <strong th:text="${ca.cliente.nome}">Nome</strong>
                                        <div class="small text-muted" th:text="'Último atendimento há ' + ${ca.diasAusente} + ' dias com ' + ${ca.ultimoProfissional}">Último há 40 dias</div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <a th:if="${ca.cliente.telefone != null}"
                                           th:href="'https://api.whatsapp.com/send?phone=55' + ${#strings.replace(#strings.replace(#strings.replace(#strings.replace(ca.cliente.telefone,' ',''),'-',''),'(',''),')','')} + '&text=Ol%C3%A1%20' + ${ca.cliente.nome} + '%2C%20estamos%20com%20saudades%20de%20voc%C3%AA%20aqui%20no%20studio%21%20Que%20tal%20agendar%20um%20hor%C3%A1rio%20com%20um%20desconto%20especial%3F'"
                                           target="_blank" class="btn btn-sm btn-outline-success" title="Enviar WhatsApp">
                                            <i class="bi bi-whatsapp"></i> Chamar
                                        </a>
                                        <a th:href="@{/{slug}/fidelizacao/cliente/{id}/historico(slug=${empresaSlug}, id=${ca.cliente.id})}" class="btn btn-sm btn-outline-secondary">
                                            Histórico
                                        </a>
                                    </div>
                                </div>
                                <div th:if="${clientesAusentes == null or #lists.isEmpty(clientesAusentes)}" class="text-center py-4 text-muted">
                                    Nenhum cliente em atraso de retorno no momento. Excelente retenção!
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ANIVERSARIANTES DO MÊS -->
                <div class="col-lg-6">
                    <div class="content-card h-100">
                        <div class="card-header-custom d-flex justify-content-between align-items-center">
                            <h3 class="card-title-custom text-warning">
                                <i class="bi bi-gift-fill"></i>
                                <span>Aniversariantes do Mês</span>
                            </h3>
                            <span class="badge bg-warning text-dark" th:text="${aniversariantes != null ? aniversariantes.size() : 0} + ' aniversariantes'">0</span>
                        </div>
                        <div class="p-3">
                            <div class="list-group list-group-flush">
                                <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3" th:each="aniv : ${aniversariantes}">
                                    <div>
                                        <strong th:text="${aniv.nome}">Nome</strong>
                                        <div class="small text-muted" th:text="'Data: ' + ${#temporals.format(aniv.dataNascimento, 'dd/MM')}">05/09</div>
                                    </div>
                                    <a th:if="${aniv.telefone != null}"
                                       th:href="'https://api.whatsapp.com/send?phone=55' + ${#strings.replace(#strings.replace(#strings.replace(#strings.replace(aniv.telefone,' ',''),'-',''),'(',''),')','')} + '&text=Parab%C3%A9ns%20' + ${aniv.nome} + '%21%20O%20Studio%20te%20deseja%20um%20feliz%20anivers%C3%A1rio%21%20Temos%20um%20presente%20especial%20para%20voc%C3%AA%20no%20seu%20pr%C3%B3ximo%20atendimento%21'"
                                       target="_blank" class="btn btn-sm btn-gold" title="Enviar Parabéns WhatsApp">
                                        <i class="bi bi-whatsapp"></i> Presente
                                    </a>
                                </div>
                                <div th:if="${aniversariantes == null or #lists.isEmpty(aniversariantes)}" class="text-center py-4 text-muted">
                                    Nenhum aniversariante cadastrado neste mês.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
