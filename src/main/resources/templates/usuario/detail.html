<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Usuário | Beauty Salon</title>

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-layout">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div>

    <!-- MAIN AREA -->
    <div class="app-main">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar('Detalhes do Usuário', 'Perfil e informações do operador')}"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="page-content">
            <div class="form-container-card">
                <div class="form-header">
                    <h2 class="form-title">
                        <i class="bi bi-person-lines-fill text-primary me-2"></i>
                        <span>Perfil do Usuário</span>
                    </h2>
                    <p class="form-subtitle">Informações registradas no sistema.</p>
                </div>

                <div class="p-3 bg-light rounded mb-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="cell-avatar" style="width: 54px; height: 54px; font-size: 1.25rem;">
                            <span th:text="${user.username != null and !#strings.isEmpty(user.username) ? #strings.substring(user.username, 0, 1).toUpperCase() : 'U'}">U</span>
                        </div>
                        <div>
                            <h4 class="mb-0" th:text="${user.username}">admin</h4>
                            <span class="text-muted small" th:text="'Código #' + ${user.id}">#1</span>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <span class="text-muted d-block small">E-mail:</span>
                            <strong th:text="${user.email}">admin@beautysalon.com</strong>
                        </div>
                        <div class="col-md-6">
                            <span class="text-muted d-block small">Status:</span>
                            <span class="badge-status badge-status-confirmed">Ativo</span>
                        </div>
                    </div>
                </div>

                <div class="form-actions-bar">
                    <a th:href="@{/{slug}/usuarios/{id}(slug=${empresaSlug}, id=${user.id})}" class="btn btn-gold">
                        <i class="bi bi-pencil"></i> Editar Dados
                    </a>
                    <a th:href="@{/{slug}/usuarios(slug=${empresaSlug})}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Voltar à Lista
                    </a>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
