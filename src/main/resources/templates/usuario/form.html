<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Usuário | Beauty Salon</title>

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-layout">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div>

    <!-- MAIN AREA -->
    <div class="app-main">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar('Operador do Studio', 'Cadastro e manutenção de credenciais e permissões')}"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="page-content">
            <div class="form-container-card">
                <div class="form-header">
                    <h2 class="form-title">
                        <i class="bi bi-person-gear text-primary me-2"></i>
                        <span th:text="${usuario.id == null ? 'Novo Operador' : 'Editar Operador'}">Usuário</span>
                    </h2>
                    <p class="form-subtitle">Configure as credenciais de login e atribua o nível de acesso à empresa.</p>
                </div>

                <!-- Formulário de Criação (usuario.id == null) -->
                <form th:if="${usuario.id == null}" th:action="@{/{slug}/usuarios(slug=${empresaSlug})}" method="post" th:object="${usuario}" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="createNome">Nome Completo:</label>
                        <input type="text" id="createNome" th:field="*{nome}" class="form-control-modern" placeholder="Ex: Keilla Oliveira" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="createUsername">Nome de Usuário (Login):</label>
                        <input type="text" id="createUsername" th:field="*{username}" class="form-control-modern" placeholder="Ex: keilla_studio" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="createEmail">E-mail Corporativo:</label>
                        <input type="email" id="createEmail" th:field="*{email}" class="form-control-modern" placeholder="usuario@beautysalon.com" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="createPassword">Senha de Acesso:</label>
                        <input type="password" id="createPassword" th:field="*{password}" class="form-control-modern" placeholder="••••••••" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="createEspecialidade">Especialidade / Cargo:</label>
                            <input type="text" id="createEspecialidade" th:field="*{especialidade}" class="form-control-modern" placeholder="Ex: Cabeleireiro(a), Barbeiro, Manicure" />
                        </div>

                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="createTelefone">Telefone / WhatsApp:</label>
                            <input type="text" id="createTelefone" th:field="*{telefone}" class="form-control-modern" placeholder="(11) 99999-8888" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="createComissao">Comissão Padrão (%):</label>
                            <input type="number" step="0.5" min="0" max="100" id="createComissao" th:field="*{percentualComissao}" class="form-control-modern" placeholder="Ex: 30.0" />
                        </div>

                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="createCorAgenda">Cor no Painel da Agenda:</label>
                            <input type="color" id="createCorAgenda" th:field="*{corAgenda}" class="form-control-color w-100" style="height: 48px; border-radius: 8px;" value="#d4af37" />
                        </div>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="createRole">Nível de Permissão:</label>
                        <select id="createRole" th:field="*{tenantRole}" class="form-control-modern">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.name()}"></option>
                        </select>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern">Foto de Perfil (Avatar):</label>
                        <input type="file" name="imagem" accept="image/*" class="form-control-modern" />
                    </div>

                    <div class="form-actions-bar">
                        <button type="submit" class="btn btn-gold">
                            <i class="bi bi-check-circle-fill"></i> Salvar Operador
                        </button>
                        <a th:href="@{/{slug}/usuarios(slug=${empresaSlug})}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>

                <!-- Formulário de Edição (usuario.id != null) -->
                <form th:unless="${usuario.id == null}" th:action="@{/{slug}/usuarios/{id}/atualizar(slug=${empresaSlug}, id=${usuario.id})}" method="post" th:object="${usuario}" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="editNome">Nome Completo:</label>
                        <input type="text" id="editNome" th:field="*{nome}" class="form-control-modern" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="editUsername">Nome de Usuário (Login):</label>
                        <input type="text" id="editUsername" th:field="*{username}" class="form-control-modern" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="editEmail">E-mail Corporativo:</label>
                        <input type="email" id="editEmail" th:field="*{email}" class="form-control-modern" required />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="editPassword">Nova Senha (deixe em branco para manter a atual):</label>
                        <input type="password" id="editPassword" th:field="*{password}" class="form-control-modern" placeholder="••••••••" />
                        <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="editEspecialidade">Especialidade / Cargo:</label>
                            <input type="text" id="editEspecialidade" th:field="*{especialidade}" class="form-control-modern" placeholder="Ex: Cabeleireiro(a), Barbeiro, Manicure" />
                        </div>

                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="editTelefone">Telefone / WhatsApp:</label>
                            <input type="text" id="editTelefone" th:field="*{telefone}" class="form-control-modern" placeholder="(11) 99999-8888" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="editComissao">Comissão Padrão (%):</label>
                            <input type="number" step="0.5" min="0" max="100" id="editComissao" th:field="*{percentualComissao}" class="form-control-modern" placeholder="Ex: 30.0" />
                        </div>

                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="editCorAgenda">Cor no Painel da Agenda:</label>
                            <input type="color" id="editCorAgenda" th:field="*{corAgenda}" class="form-control-color w-100" style="height: 48px; border-radius: 8px;" />
                        </div>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="editRole">Nível de Permissão:</label>
                        <select id="editRole" th:field="*{tenantRole}" class="form-control-modern">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.name()}"
                                    th:selected="${usuario.tenantRole == r}"></option>
                        </select>
                    </div>

                    <div class="form-group-modern">
                        <label class="form-label-modern">Alterar Foto de Perfil:</label>
                        <input type="file" name="imagem" accept="image/*" class="form-control-modern" />
                        <div th:if="${usuario.imagemUrl != null}" class="image-preview-box">
                            <span class="d-block small text-muted mb-1">Foto atual:</span>
                            <img th:src="@{${usuario.imagemUrl}}" class="image-preview-thumb" alt="Avatar" style="max-height: 90px; border-radius: var(--radius-full);" />
                        </div>
                    </div>

                    <div class="form-actions-bar">
                        <button type="submit" class="btn btn-gold">
                            <i class="bi bi-check-circle-fill"></i> Atualizar Operador
                        </button>
                        <a th:href="@{/{slug}/usuarios(slug=${empresaSlug})}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
