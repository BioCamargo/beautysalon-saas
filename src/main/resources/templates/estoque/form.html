<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Produto | Beauty Salon</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('estoque')}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/topbar :: topbar('Cadastro de Produto', 'Gerenciar itens de revenda e consumo')}"></div>

        <main class="page-content">
            <div class="form-container-card">
                <div class="form-header">
                    <h2 class="form-title">
                        <i class="bi bi-box-seam text-primary me-2"></i>
                        <span th:text="${produto.id == null ? 'Novo Produto' : 'Editar Produto'}">Produto</span>
                    </h2>
                    <p class="form-subtitle">Informe os dados cadastrais, custos e níveis de estoque mínimo.</p>
                </div>

                <form th:action="@{/{slug}/estoque/produtos(slug=${empresaSlug})}" method="post" th:object="${produto}">
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group-modern">
                        <label class="form-label-modern" for="nome">Nome do Produto:</label>
                        <input type="text" id="nome" th:field="*{nome}" class="form-control-modern" placeholder="Ex: Máscara Reconstrutora 500g" required />
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="marca">Marca / Fabricante:</label>
                            <input type="text" id="marca" th:field="*{marca}" class="form-control-modern" placeholder="Ex: Wella, Truss, Braé" />
                        </div>
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="categoria">Categoria:</label>
                            <input type="text" id="categoria" th:field="*{categoria}" class="form-control-modern" placeholder="Ex: Cabelos, Barba, Unhas" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="tipo">Destinação / Tipo:</label>
                            <select id="tipo" th:field="*{tipo}" class="form-control-modern">
                                <option value="REVENDA">Revenda (Venda direta ao cliente na comanda)</option>
                                <option value="CONSUMO_INTERNO">Consumo Interno (Uso nos serviços do salão)</option>
                            </select>
                        </div>
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="unidadeMedida">Unidade de Medida:</label>
                            <input type="text" id="unidadeMedida" th:field="*{unidadeMedida}" class="form-control-modern" placeholder="UN, ML, G, CX, FRASCO" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="precoCusto">Preço de Custo (R$):</label>
                            <input type="number" step="0.01" id="precoCusto" th:field="*{precoCusto}" class="form-control-modern" required />
                        </div>
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="precoVenda">Preço de Venda (R$):</label>
                            <input type="number" step="0.01" id="precoVenda" th:field="*{precoVenda}" class="form-control-modern" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="quantidadeEstoque">Quantidade Atual em Estoque:</label>
                            <input type="number" id="quantidadeEstoque" th:field="*{quantidadeEstoque}" class="form-control-modern" required />
                        </div>
                        <div class="col-md-6 form-group-modern">
                            <label class="form-label-modern" for="estoqueMinimo">Estoque Mínimo (Alerta de reposição):</label>
                            <input type="number" id="estoqueMinimo" th:field="*{estoqueMinimo}" class="form-control-modern" required />
                        </div>
                    </div>

                    <div class="form-actions-bar">
                        <button type="submit" class="btn btn-gold">
                            <i class="bi bi-check-circle-fill"></i> Salvar Produto
                        </button>
                        <a th:href="@{/{slug}/estoque(slug=${empresaSlug})}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
