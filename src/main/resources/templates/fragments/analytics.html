<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- ========================================================================= -->
<!-- FRAGMENTO OFICIAL OPENREPLAY (TRACKER CDN v19 COMPATÍVEL COM NAVEGADOR) -->
<!-- ========================================================================= -->
<th:block th:fragment="openreplay">
    <script th:if="${@environment.getProperty('nexipro.analytics.openreplay.enabled') == 'true' and @environment.getProperty('nexipro.analytics.openreplay.project-key') != null and !#strings.isEmpty(@environment.getProperty('nexipro.analytics.openreplay.project-key'))}">
        (function() {
            var projectKey = "[[${@environment.getProperty('nexipro.analytics.openreplay.project-key')}]]";
            if (!projectKey || projectKey.trim() === '') return;

            var initOpts = {
                projectKey: projectKey,
                defaultInputMode: 2, // Mascara campos confidenciais e emails por padrão (LGPD)
                obscureTextNumbers: false,
                obscureTextEmails: true
            };

            var startOpts = {
                userID: "[[${#authentication != null and #authentication.name != 'anonymousUser' ? #authentication.name : ''}]]"
            };

            // Loader Oficial do OpenReplay CDN
            (function(A, s, a, y, e, r) {
                r = window.OpenReplay = [e, r, y, [s - 1, e]];
                s = document.createElement('script');
                s.src = A;
                s.async = !a;
                document.getElementsByTagName('head')[0].appendChild(s);
            })("//static.openreplay.com/latest/openreplay.js", 1, 0, initOpts, startOpts);

            // Metadados do Estabelecimento Multi-Tenant
            /*[# th:if="${empresaSlug != null}"]*/
            window.OpenReplay = window.OpenReplay || [];
            window.OpenReplay.push(['setMetadata', 'empresa_slug', '[[${empresaSlug}]]']);
            /*[/]*/
            /*[# th:if="${empresaPlano != null}"]*/
            window.OpenReplay.push(['setMetadata', 'plano', '[[${empresaPlano}]]']);
            /*[/]*/
            /*[# th:if="${empresaTrialAtivo != null}"]*/
            window.OpenReplay.push(['setMetadata', 'trial_ativo', '[[${empresaTrialAtivo}]]']);
            /*[/]*/
        })();
    </script>
</th:block>

</body>
</html>
