spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:267-fpc-1986}
spring.datasource.driver-class-name=org.postgresql.Driver

# Habilita auto-criação/atualização do schema em testes e desativa Flyway
