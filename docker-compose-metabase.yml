version: '3.8'

services:
  # ===================================================================
  # Metabase — BI & Analytics Interno do Fundador (NEXI PRO SaaS)
  # Acesso: http://localhost:3000
  # ===================================================================
  metabase:
    image: metabase/metabase:latest
    container_name: nexipro-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Limite de memória Heap da JVM respeitando diretrizes FinOps
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms128m"
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_EMOJI_IN_LOGS: "true"
      MB_ANON_TRACKING_ENABLED: "false"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - beautysalon-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  metabase_data:
    driver: local

networks:
  beautysalon-net:
    external: true
