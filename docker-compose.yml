version: '3.8'

services:
  # -------------------------------------------------------------
  # Banco de Dados Relacional: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: beautysalon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-267-fpc-1986}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beautysalon-net

  # -------------------------------------------------------------
  # Mensageria Assíncrona: RabbitMQ com Painel Management
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: beautysalon-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"   # Protocolo AMQP
      - "15672:15672" # Painel Web Management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - beautysalon-net

  # -------------------------------------------------------------
  # Aplicação Principal: BeautySalon / LUMORA SaaS Backend
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beautysalon-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/studio
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-267-fpc-1986}
      JWT_SECRET: ${JWT_SECRET:-BeautySalonSuperSecretKeyForJwtAuthenticationTokenGeneration2026!}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
    ports:
      - "8081:8081"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - beautysalon-net

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  app_uploads:
    driver: local

networks:
  beautysalon-net:
    driver: bridge
